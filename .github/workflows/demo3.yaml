name: Production Deploy
on:
  push:
    branches: [ master ]   

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Testing is running..."

  deploy:
    needs: test          
    runs-on: ubuntu-latest
    steps:
      - name: deploy to server
        env:
          SERVER_SECRET: ${{ secrets.MY_PASSWORD }}  # Safe password use
        run: echo "Deploying to server safely!"

  job3:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Final Step
        run: echo "Deployment complete!"
